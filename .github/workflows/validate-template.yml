name: Validate Copier Template

on:
  push:
  pull_request:

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Copier
        run: python -m pip install --disable-pip-version-check "copier>=9,<10"

      - name: Generate project from template
        run: >-
          copier copy --defaults
          --data "project_name=Template Validation"
          --data "project_slug=template-validation"
          --data "package_name=template_validation"
          --data "python_version=3.13"
          . ./generated

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project dependencies
        working-directory: generated
        run: uv sync --all-groups

      - name: Lint
        working-directory: generated
        run: uv run ruff check .

      - name: Check formatting
        working-directory: generated
        run: uv run ruff format --check .

      - name: Test
        working-directory: generated
        run: uv run pytest

      - name: CLI configuration smoke test
        working-directory: generated
        run: uv run template_validation analysis --config config.json --dry-run

      - name: Run multi-Workflow demo
        working-directory: generated
        run: uv run template_validation analysis --config config.json

      - name: Verify reports and run artifacts
        working-directory: generated
        run: |
          test -f workspace/reports/alpha/index.html
          test -f workspace/reports/beta/index.html
          test -f workspace/reports/gamma/index.html
          test "$(find workspace/logs/analysis -name manifest.json | wc -l)" -eq 1
          test "$(find workspace/logs/analysis -path '*/workflows/*.jsonl' | wc -l)" -eq 3
          test "$(find workspace/logs/analysis -name run.jsonl | wc -l)" -eq 1
