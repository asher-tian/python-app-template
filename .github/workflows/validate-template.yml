name: Validate Copier Template

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Copier
        run: python -m pip install --disable-pip-version-check "copier>=9,<10"

      - name: Generate project from template
        run: >-
          copier copy --defaults
          --data "python_version=${{ matrix.python-version }}"
          . ./template-validation

      - name: Verify generated project defaults
        working-directory: template-validation
        run: |
          python - <<'PY'
          from pathlib import Path

          assert Path("README.md").read_text(encoding="utf-8").startswith(
              "# template-validation\n"
          )
          pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
          assert 'version = "0.1.0"' in pyproject
          assert 'name = "template-validation"' in pyproject
          assert 'description = "template-validation"' in pyproject
          assert "template_validation =" in pyproject
          assert Path("src/template_validation").is_dir()
          PY

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project dependencies
        working-directory: template-validation
        run: uv sync --all-groups

      - name: Lint
        working-directory: template-validation
        run: uv run ruff check .

      - name: Test
        working-directory: template-validation
        run: uv run pytest

      - name: Run Business commands
        working-directory: template-validation
        run: |
          uv run template_validation analysis --config analysis.cfg
          uv run template_validation comparison --config comparison.cfg

      - name: Verify Run records and Business paths
        working-directory: template-validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("workspace")
          run_files = list((root / ".app" / "runs").glob("*/run.json"))
          assert len(run_files) == 2
          records = [json.loads(path.read_text()) for path in run_files]
          assert {record["business_id"] for record in records} == {"analysis", "comparison"}
          assert all(record["status"] == "success" for record in records)
          assert not (root / "workspace.json").exists()
          assert not (root / "businesses").exists()
          assert not (root / "shared").exists()
          assert (root / "analysis" / "reports").is_dir()
          assert (root / "comparison" / "reports").is_dir()
          PY

      - name: Install Chromium for browser smoke test
        if: matrix.python-version == '3.13'
        working-directory: template-validation
        run: uv run --with playwright playwright install --with-deps chromium

      - name: Run browser smoke test
        if: matrix.python-version == '3.13'
        working-directory: template-validation
        env:
          RUN_BROWSER_SMOKE: "1"
        run: uv run --with playwright pytest tests/test_frontend_browser.py
