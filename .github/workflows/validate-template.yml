name: Validate Copier Template

on:
  push:
  pull_request:

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Copier
        run: python -m pip install --disable-pip-version-check "copier>=9,<10"

      - name: Generate project from template
        run: >-
          copier copy --defaults
          --data "project_name=Template Validation"
          --data "project_slug=template-validation"
          --data "package_name=template_validation"
          --data "python_version=${{ matrix.python-version }}"
          . ./generated

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project dependencies
        working-directory: generated
        run: uv sync --all-groups

      - name: Lint
        working-directory: generated
        run: uv run ruff check .

      - name: Format generated project
        working-directory: generated
        run: uv run ruff format .

      - name: Check formatting
        working-directory: generated
        run: uv run ruff format --check .

      - name: Test
        working-directory: generated
        run: uv run pytest

      - name: Run both Business commands
        working-directory: generated
        run: |
          uv run template_validation analysis --config analysis.cfg
          uv run template_validation comparison --config comparison.cfg

      - name: Verify Workspace and shared Group Labels
        working-directory: generated
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("workspace")
          analysis = json.loads((root / "businesses/analysis/business.json").read_text())
          comparison = json.loads((root / "businesses/comparison/business.json").read_text())
          assert {item["group_id"] for item in analysis["groups"]} == {"alpha", "beta", "gamma"}
          assert {item["group_id"] for item in comparison["groups"]} == {"alpha", "beta"}
          assert (root / ".app/workspace.json").is_file()
          assert (root / "shared").is_dir()
          assert len(list((root / ".app/runs").glob("*/manifest.json"))) == 2
          PY

      - name: HTTP CLI smoke test
        working-directory: generated
        run: uv run template_validation http --help
