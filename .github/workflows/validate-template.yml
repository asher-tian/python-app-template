name: Validate Copier Template

on:
  push:
  pull_request:

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Copier
        run: python -m pip install --disable-pip-version-check "copier>=9,<10"

      - name: Generate project from template
        run: >-
          copier copy --defaults
          --data "project_name=Template Validation"
          --data "project_slug=template-validation"
          --data "package_name=template_validation"
          --data "python_version=${{ matrix.python-version }}"
          . ./generated

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project dependencies
        working-directory: generated
        run: uv sync --all-groups

      - name: Lint
        working-directory: generated
        run: uv run ruff check .

      - name: Format generated project
        working-directory: generated
        run: uv run ruff format .

      - name: Check formatting
        working-directory: generated
        run: uv run ruff format --check .

      - name: Test
        working-directory: generated
        run: uv run pytest

      - name: Validate report frontend JavaScript
        working-directory: generated
        run: |
          node --check src/template_validation/report/frontend/report.js
          node --input-type=module --check < src/template_validation/report/frontend/businesses/analysis.js
          node --input-type=module --check < src/template_validation/report/frontend/businesses/comparison.js

      - name: Run both Business commands
        working-directory: generated
        run: |
          uv run template_validation analysis --config analysis.cfg
          uv run template_validation comparison --config comparison.cfg

      - name: Verify per-Run records and custom business paths
        working-directory: generated
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("workspace")
          run_files = list((root / ".app" / "runs").glob("*/run.json"))
          assert len(run_files) == 2
          records = [json.loads(path.read_text()) for path in run_files]
          assert {record["business_id"] for record in records} == {"analysis", "comparison"}
          assert all(record["status"] == "success" for record in records)
          assert not (root / "workspace.json").exists()
          assert not (root / "businesses").exists()
          assert not (root / "shared").exists()
          assert (root / "analysis" / "reports").is_dir()
          assert (root / "comparison" / "reports").is_dir()
          PY

      - name: HTTP CLI smoke test
        working-directory: generated
        run: uv run template_validation http --help
